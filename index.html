<script>
  const form = document.getElementById("surveyForm");

  // ハイフンがちょうど2個あるかチェック
  function checkPhoneNumber(value) {
    const hyphenCount = (value.match(/-/g) || []).length;
    return hyphenCount === 2;
  }

  form.addEventListener("submit", function (event) {

    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const homeTel = document.getElementById("homeTel").value.trim();
    const mobileTel = document.getElementById("mobileTel").value.trim();

    if (!checkPhoneNumber(homeTel)) {
      alert("自宅番号はハイフンを2つ入れて入力してください。\n例：0748-12-3456");
      document.getElementById("homeTel").focus();
      return;
    }

    if (!checkPhoneNumber(mobileTel)) {
      alert("携帯番号はハイフンを2つ入れて入力してください。\n例：090-1234-5678");
      document.getElementById("mobileTel").focus();
      return;
    }

    const data = {
      name: name,
      homeTel: homeTel,
      mobileTel: mobileTel
    };

    console.log(data);

    alert("入力内容に問題ありません。");
  });
</script>
