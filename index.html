<script>
  const form = document.getElementById("surveyForm");

  const homeTelInput = document.getElementById("homeTel");
  const mobileTelInput = document.getElementById("mobileTel");

  // 電話番号欄：半角数字と半角ハイフン以外をその場で除去
  function restrictPhoneInput(input) {
    input.addEventListener("input", function () {
      this.value = this.value.replace(/[^0-9-]/g, "");
    });
  }

  restrictPhoneInput(homeTelInput);
  restrictPhoneInput(mobileTelInput);


  // 電話番号形式チェック
  // 使用可能文字：半角数字、半角ハイフン
  // ハイフン：必ず2個
  function checkPhoneNumber(value) {

    // 半角数字とハイフン以外があればNG
    if (!/^[0-9-]+$/.test(value)) {
      return false;
    }

    // ハイフンの個数を確認
    const hyphenCount = (value.match(/-/g) || []).length;

    if (hyphenCount !== 2) {
      return false;
    }

    return true;
  }


  form.addEventListener("submit", function (event) {

    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const homeTel = homeTelInput.value.trim();
    const mobileTel = mobileTelInput.value.trim();


    // 自宅番号チェック
    if (!checkPhoneNumber(homeTel)) {
      alert(
        "自宅番号を正しく入力してください。\n" +
        "半角数字とハイフンのみ使用できます。\n" +
        "例：0748-12-3456"
      );

      homeTelInput.focus();
      return;
    }


    // 携帯番号チェック
    if (!checkPhoneNumber(mobileTel)) {
      alert(
        "携帯番号を正しく入力してください。\n" +
        "半角数字とハイフンのみ使用できます。\n" +
        "例：090-1234-5678"
      );

      mobileTelInput.focus();
      return;
    }


    const data = {
      name: name,
      homeTel: homeTel,
      mobileTel: mobileTel
    };

    console.log(data);

    alert("入力内容に問題ありません。");
  });
</script>
