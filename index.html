<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>アンケート入力</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: #f5f5f5;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
      color: #444;
    }

    /* ページ全体 */
    .page {
      width: 100%;
      max-width: 650px;
      margin: 40px auto;
    }

    /* タイトル */
    h1 {
      margin: 0 0 30px;
      color: #00b84f;
      font-size: 30px;
      font-weight: 700;
      text-align: center;
    }

    /* 各カード */
    .container {
      width: 100%;
      background-color: #ffffff;
      border-top: 5px solid #00c853;
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 24px;

      box-shadow:
        0 3px 8px rgba(0, 0, 0, 0.12);
    }

    /* カードタイトル */
    .form-title {
      margin: 0 0 25px;
      color: #00b84f;
      font-size: 20px;
      font-weight: 700;
    }

    /* 入力項目 */
    .form-group {
      margin-bottom: 24px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #444;
      font-size: 15px;
      font-weight: 600;
    }

    .required {
      display: inline-block;
      margin-left: 6px;
      color: #e74c3c;
      font-size: 12px;
      font-weight: 600;
    }

    .optional {
      display: inline-block;
      margin-left: 6px;
      color: #888;
      font-size: 12px;
      font-weight: normal;
    }

    /* 入力欄 */
    input {
      width: 100%;
      height: 48px;
      padding: 10px 12px;
      border: 1px solid #cccccc;
      border-radius: 6px;
      background-color: #ffffff;
      color: #333;
      font-size: 16px;
      outline: none;

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    input:focus {
      border-color: #00c853;

      box-shadow:
        0 0 0 2px rgba(0, 200, 83, 0.12);
    }

    /* 郵便番号検索メッセージ */
    .zip-message {
      min-height: 20px;
      margin-top: 7px;
      color: #666666;
      font-size: 13px;
    }

    .zip-message.success {
      color: #00883b;
    }

    .zip-message.error {
      color: #d93025;
    }

    /* 入力完了ボタン */
    button {
      width: 100%;
      height: 50px;
      margin-top: 4px;
      border: none;
      border-radius: 6px;
      background-color: #00b84f;
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;

      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #009f45;
    }

    button:active {
      background-color: #00883b;
    }

    /* スマートフォン */
    @media (max-width: 600px) {

      body {
        padding: 12px;
      }

      .page {
        margin: 20px auto;
      }

      h1 {
        font-size: 25px;
      }

      .container {
        padding: 24px 18px;
        margin-bottom: 18px;
      }
    }
  </style>
</head>


<body>

  <div class="page">

    <h1>尾賀亀カルテ</h1>

    <form id="surveyForm">


      <!-- ====================================== -->
      <!-- お客さま基本情報カード -->
      <!-- ====================================== -->

      <div class="container">

        <div class="form-title">
          お客さま基本情報
        </div>


        <!-- 氏名 -->

        <div class="form-group">

          <label for="name">
            氏名
            <span class="required">必須</span>
          </label>

          <input
            type="text"
            id="name"
            name="name"
            placeholder="例：山田 太郎"
            autocomplete="name"
            required
          >

        </div>


        <!-- 自宅番号 -->

        <div class="form-group">

          <label for="homeTel">
            自宅番号
            <span class="optional">任意</span>
          </label>

          <input
            type="tel"
            id="homeTel"
            name="homeTel"
            inputmode="tel"
            placeholder="例：0748-12-3456"
            autocomplete="tel"
          >

        </div>


        <!-- 携帯番号 -->

        <div class="form-group">

          <label for="mobileTel">
            携帯番号
            <span class="optional">任意</span>
          </label>

          <input
            type="tel"
            id="mobileTel"
            name="mobileTel"
            inputmode="tel"
            placeholder="例：090-1234-5678"
          >

        </div>

      </div>


      <!-- ====================================== -->
      <!-- 住所情報カード -->
      <!-- ====================================== -->

      <div class="container">

        <div class="form-title">
          住所情報
        </div>


        <!-- 郵便番号 -->

        <div class="form-group">

          <label for="zipcode">
            郵便番号
            <span class="required">必須</span>
          </label>

          <input
            type="text"
            id="zipcode"
            name="zipcode"
            inputmode="numeric"
            maxlength="8"
            placeholder="例：523-0892"
            autocomplete="postal-code"
            required
          >

          <div
            id="zipMessage"
            class="zip-message"
            aria-live="polite"
          ></div>

        </div>


        <!-- 住所1 -->

        <div class="form-group">

          <label for="address1">
            住所1
            <span class="optional">都道府県</span>
          </label>

          <input
            type="text"
            id="address1"
            name="address1"
            placeholder="例：滋賀県"
            autocomplete="address-level1"
          >

        </div>


        <!-- 住所2 -->

        <div class="form-group">

          <label for="address2">
            住所2
            <span class="optional">市区町村</span>
          </label>

          <input
            type="text"
            id="address2"
            name="address2"
            placeholder="例：近江八幡市"
            autocomplete="address-level2"
          >

        </div>


        <!-- 住所3 -->

        <div class="form-group">

          <label for="address3">
            住所3
            <span class="optional">町域</span>
          </label>

          <input
            type="text"
            id="address3"
            name="address3"
            placeholder="例：出町"
            autocomplete="address-line1"
          >

        </div>


        <!-- 住所4 -->

        <div class="form-group">

          <label for="address4">
            住所4
            <span class="optional">丁目・番地</span>
          </label>

          <input
            type="text"
            id="address4"
            name="address4"
            placeholder="例：1丁目2-3"
            autocomplete="address-line2"
          >

        </div>


        <!-- 住所5 -->

        <div class="form-group">

          <label for="address5">
            住所5
            <span class="optional">マンション・アパート</span>
          </label>

          <input
            type="text"
            id="address5"
            name="address5"
            placeholder="例：尾賀亀ハイツ105号室"
            autocomplete="address-line3"
          >

        </div>

      </div>

        <!-- ====================================== -->
        <!-- 車両情報カード -->
        <!-- ====================================== -->
        
        <div class="container">
        
          <div class="form-title">
            車両情報
          </div>
        
        
          <!-- 登録番号情報 -->
        
          <div class="form-group">
        
            <label for="registrationNumber">
              登録番号情報
              <span class="required">必須</span>
            </label>
        
            <input
              type="text"
              id="registrationNumber"
              name="registrationNumber"
              placeholder="例：滋賀580あ1234"
              required
            >
        
          </div>
        
        
          <!-- 車名 -->
        
          <div class="form-group">
        
            <label for="carName">
              車名
              <span class="required">必須</span>
            </label>
        
            <input
              type="text"
              id="carName"
              name="carName"
              placeholder="例：タント"
              required
            >
        
          </div>
        
        </div>
      
      <!-- 入力完了 -->

      <button type="submit">
        入力完了
      </button>

    </form>

  </div>


  <script>
    "use strict";

    const form =
      document.getElementById("surveyForm");

    const homeTelInput =
      document.getElementById("homeTel");

    const mobileTelInput =
      document.getElementById("mobileTel");

    const zipcodeInput =
      document.getElementById("zipcode");

    const address1Input =
      document.getElementById("address1");

    const address2Input =
      document.getElementById("address2");

    const address3Input =
      document.getElementById("address3");

    const address4Input =
      document.getElementById("address4");

    const address5Input =
  document.getElementById("address5");

    const registrationNumberInput =
      document.getElementById("registrationNumber");
    
    const carNameInput =
      document.getElementById("carName");
    
    const zipMessage =
      document.getElementById("zipMessage");

    // ========================================
    // 電話番号入力制限
    // 半角数字と半角ハイフンのみ
    // ========================================

    function restrictPhoneInput(input) {

      input.addEventListener("input", function () {

        this.value =
          this.value.replace(/[^0-9-]/g, "");

      });

    }


    restrictPhoneInput(homeTelInput);
    restrictPhoneInput(mobileTelInput);


    // ========================================
    // 電話番号チェック
    // ========================================

    function checkPhoneNumber(value) {

      if (value === "") {
        return true;
      }

      if (!/^[0-9-]+$/.test(value)) {
        return false;
      }

      const hyphenCount =
        (value.match(/-/g) || []).length;

      return hyphenCount === 2;

    }


    // ========================================
    // 郵便番号メッセージ表示
    // ========================================

    function showZipMessage(message, type) {

      zipMessage.textContent = message;

      zipMessage.className = "zip-message";

      if (type) {
        zipMessage.classList.add(type);
      }

    }


    // ========================================
    // 郵便番号入力
    // ========================================

    zipcodeInput.addEventListener("input", function () {

      this.value =
        this.value.replace(/[^0-9-]/g, "");

      const zipcode = this.value;


      if (zipcode === "") {

        showZipMessage("", "");

        return;

      }


      if (zipcode.length === 8) {

        if (!/^\d{3}-\d{4}$/.test(zipcode)) {

          showZipMessage(
            "郵便番号は「123-4567」の形式で入力してください。",
            "error"
          );

          return;

        }

        searchAddress(zipcode);

        return;

      }


      showZipMessage(
        "ハイフン付きで入力してください。例：523-0891",
        ""
      );

    });


    // ========================================
    // 郵便番号から住所検索
    // ========================================

    async function searchAddress(zipcode) {

      showZipMessage(
        "住所を検索しています。",
        ""
      );


      try {

        const url =
          "https://zipcloud.ibsnet.co.jp/api/search?zipcode=" +
          encodeURIComponent(zipcode);


        const response =
          await fetch(url);


        if (!response.ok) {

          throw new Error(
            "通信エラー：" + response.status
          );

        }


        const result =
          await response.json();


        if (
          result.status !== 200 ||
          !result.results ||
          result.results.length === 0
        ) {

          address1Input.value = "";
          address2Input.value = "";
          address3Input.value = "";

          showZipMessage(
            "該当する住所が見つかりませんでした。",
            "error"
          );

          return;

        }


        const address =
          result.results[0];


        address1Input.value =
          address.address1 || "";

        address2Input.value =
          address.address2 || "";

        address3Input.value =
          address.address3 || "";


        showZipMessage(
          "住所を自動入力しました。",
          "success"
        );

      } catch (error) {

        console.error(error);

        showZipMessage(
          "住所を取得できませんでした。通信状況を確認してください。",
          "error"
        );

      }

    }


    // ========================================
    // 郵便番号チェック
    // ========================================

    function checkZipcode(value) {

      return /^\d{3}-\d{4}$/.test(value);

    }


    // ========================================
    // 入力完了
    // ========================================

    form.addEventListener(
      "submit",
      function (event) {

        event.preventDefault();


        const name =
          document
            .getElementById("name")
            .value
            .trim();


        const homeTel =
          homeTelInput
            .value
            .trim();


        const mobileTel =
          mobileTelInput
            .value
            .trim();


        const zipcode =
          zipcodeInput
            .value
            .trim();


        const address1 =
          address1Input
            .value
            .trim();


        const address2 =
          address2Input
            .value
            .trim();


        const address3 =
          address3Input
            .value
            .trim();


        const address4 =
          address4Input
            .value
            .trim();


        const address5 =
          address5Input
            .value
            .trim();

        const registrationNumber =
          registrationNumberInput
            .value
            .trim();
        
        const carName =
          carNameInput
            .value
            .trim();


        // ========================================
        // 自宅番号チェック
        // ========================================

        if (!checkPhoneNumber(homeTel)) {

          alert(
            "自宅番号を以下の通り入力してください。\n\n" +
            "例：0748-12-3456"
          );

          homeTelInput.focus();

          return;

        }


        // ========================================
        // 携帯番号チェック
        // ========================================

        if (!checkPhoneNumber(mobileTel)) {

          alert(
            "携帯番号を以下の通り入力してください。\n\n" +
            "例：090-1234-5678"
          );

          mobileTelInput.focus();

          return;

        }


        // ========================================
        // 郵便番号チェック
        // ========================================

        if (!checkZipcode(zipcode)) {

          alert(
            "郵便番号を以下の通り入力してください。\n\n" +
            "例：523-0891"
          );

          zipcodeInput.focus();

          return;

        }


        // ========================================
        // 入力完了用データ
        // ========================================

        const data = {

            name: name,
          
            homeTel: homeTel,
          
            mobileTel: mobileTel,
          
            zipcode: zipcode,
          
            address1: address1,
          
            address2: address2,
          
            address3: address3,
          
            address4: address4,
          
            address5: address5,
          
            registrationNumber: registrationNumber,
          
            carName: carName
          
          };

        console.log(data);


        alert(
          "入力内容に問題ありません。"
        );

      }
    );

  </script>

</body>

</html>
