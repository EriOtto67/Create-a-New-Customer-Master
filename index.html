<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>尾賀亀カルテ入力</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: #f5f5f5;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
      color: #444;
    }

    /* ページ全体 */
    .page {
      width: 100%;
      max-width: 650px;
      margin: 40px auto;
    }

    /* タイトル */
    h1 {
      margin: 0 0 30px;
      color: #00b84f;
      font-size: 30px;
      font-weight: 700;
      text-align: center;
    }

    /* 各カード */
    .container {
      width: 100%;
      background-color: #ffffff;
      border-top: 5px solid #00c853;
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 24px;

      box-shadow:
        0 3px 8px rgba(0, 0, 0, 0.12);
    }

    /* カードタイトル */
    .form-title {
      margin: 0 0 25px;
      color: #00b84f;
      font-size: 20px;
      font-weight: 700;
    }

    /* 入力項目 */
    .form-group {
      margin-bottom: 24px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #444;
      font-size: 15px;
      font-weight: 600;
    }

    .required {
      display: inline-block;
      margin-left: 6px;
      color: #e74c3c;
      font-size: 12px;
      font-weight: 600;
    }

    .optional {
      display: inline-block;
      margin-left: 6px;
      color: #888;
      font-size: 12px;
      font-weight: normal;
    }

    /* 入力欄 */
      input,
      select {
        width: 100%;
        height: 48px;
      padding: 10px 12px;
      border: 1px solid #cccccc;
      border-radius: 6px;
      background-color: #ffffff;
      color: #333;
      font-size: 16px;
      outline: none;

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    input:focus,
    select:focus {
      border-color: #00c853;
    
      box-shadow:
        0 0 0 2px rgba(0, 200, 83, 0.12);
    }

    /* 郵便番号から自動入力される住所1・2・3 */
    input[readonly] {
      background-color: #eeeeee;
      color: #666666;
      border-color: #d5d5d5;
      cursor: default;
      caret-color: transparent;
    }
    
    input[readonly]:focus {
      border-color: #d5d5d5;
      box-shadow: none;
    }

    /* 郵便番号検索メッセージ */
    .zip-message {
      min-height: 20px;
      margin-top: 7px;
      color: #666666;
      font-size: 13px;
    }

    .zip-message.success {
      color: #00883b;
    }

    .zip-message.error {
      color: #d93025;
    }

    /* 入力完了ボタン */
    button {
      width: 100%;
      height: 50px;
      margin-top: 4px;
      border: none;
      border-radius: 6px;
      background-color: #00b84f;
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;

      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #009f45;
    }

    button:active {
      background-color: #00883b;
    }

    button:active {
  background-color: #00883b;
}


/* スタッフログイン */
.staff-login {
  max-width: 360px;
  margin: 50px auto 0;
  padding-top: 30px;
  border-top: 1px solid #dddddd;
  text-align: left;
}

.staff-login label {
  margin-bottom: 8px;
}

.staff-code-message {
  min-height: 22px;
  margin-top: 8px;
  color: #d93025;
  font-size: 14px;
  text-align: center;
}

.staff-mode-button {
  margin-top: 10px;
  background-color: #555555;
}

.staff-mode-button:hover {
  background-color: #3f3f3f;
}

.staff-mode-button:active {
  background-color: #2f2f2f;
}

/* スタッフモード画面 */
.staff-screen {
  width: 100%;
}

/* TELアポメモ */
textarea {
  width: 100%;
  min-height: 220px;
  padding: 14px;
  border: 1px solid #cccccc;
  border-radius: 6px;
  background-color: #ffffff;
  color: #333333;
  font-family: inherit;
  font-size: 16px;
  line-height: 1.7;
  resize: vertical;
  outline: none;

  transition:
    border-color 0.2s,
    box-shadow 0.2s;
}

textarea:focus {
  border-color: #00c853;

  box-shadow:
    0 0 0 2px rgba(0, 200, 83, 0.12);
}
    
    /* スマートフォン */
    @media (max-width: 600px) {

      body {
        padding: 12px;
      }

      .page {
        margin: 20px auto;
      }

      h1 {
        font-size: 25px;
      }

      .container {
        padding: 24px 18px;
        margin-bottom: 18px;
      }
    }
  </style>
</head>


<body>

  <div class="page">

    <h1>尾賀亀カルテ</h1>

    <form id="surveyForm">


      <!-- ====================================== -->
      <!-- お客さま基本情報カード -->
      <!-- ====================================== -->

      <div class="container">

        <div class="form-title">
          お客さま基本情報
        </div>

        <!-- 担当SS -->

        <div class="form-group">
        
          <label for="staffSS">
            担当SS
            <span class="required">必須</span>
          </label>
        
          <select
            id="staffSS"
            name="staffSS"
            required
          >
            <option value="">選択して下さい</option>
            <option value="ニュー長浜">ニュー長浜</option>
            <option value="EJ彦根">EJ彦根</option>
            <option value="DD八日市">DD八日市</option>
            <option value="ニュー近八">ニュー近八</option>
            <option value="EJ竜王">EJ竜王</option>
            <option value="DD守山">DD守山</option>
            <option value="EJ栗東">EJ栗東</option>
            <option value="EJ湖南草津">EJ湖南草津</option>
            <option value="京滋BP">京滋BP</option>
            
          </select>
        
        </div>

        <!-- フリガナ -->

        <div class="form-group">
        
          <label for="furigana">
            フリガナ
            <span class="required">必須</span>
          </label>
        
          <input
            type="text"
            id="furigana"
            name="furigana"
            placeholder="例：ヤマダ タロウ"
            required
          >
        
        </div>
        
        <!-- 氏名 -->

        <div class="form-group">

          <label for="name">
            氏名
            <span class="required">必須</span>
          </label>

          <input
            type="text"
            id="name"
            name="name"
            placeholder="例：山田 太郎"
            autocomplete="name"
            required
          >

        </div>


        <!-- 自宅番号 -->

        <div class="form-group">

          <label for="homeTel">
            自宅番号
            <span class="optional">任意</span>
          </label>

          <input
            type="tel"
            id="homeTel"
            name="homeTel"
            inputmode="tel"
            placeholder="例：0748-12-3456"
            autocomplete="tel"
          >

        </div>


        <!-- 携帯番号 -->

        <div class="form-group">

          <label for="mobileTel">
            携帯番号
            <span class="optional">任意</span>
          </label>

          <input
            type="tel"
            id="mobileTel"
            name="mobileTel"
            inputmode="tel"
            placeholder="例：090-1234-5678"
          >

        </div>

      </div>


      <!-- ====================================== -->
      <!-- 住所情報カード -->
      <!-- ====================================== -->

      <div class="container">

        <div class="form-title">
          住所情報
        </div>


        <!-- 郵便番号 -->

        <div class="form-group">

          <label for="zipcode">
            郵便番号
            <span class="required">必須</span>
          </label>

          <input
            type="text"
            id="zipcode"
            name="zipcode"
            inputmode="numeric"
            maxlength="8"
            placeholder="例：523-0892"
            autocomplete="postal-code"
            required
          >

          <div
            id="zipMessage"
            class="zip-message"
            aria-live="polite"
          ></div>

        </div>


        <!-- 住所1 -->

        <div class="form-group">

          <label for="address1">
            住所1
            <span class="optional">都道府県</span>
          </label>

          <input
            type="text"
            id="address1"
            name="address1"
            placeholder="例：滋賀県"
            autocomplete="address-level1"
            readonly
            tabindex="-1"
          >

        </div>


        <!-- 住所2 -->

        <div class="form-group">

          <label for="address2">
            住所2
            <span class="optional">市区町村</span>
          </label>

          <input
            type="text"
            id="address2"
            name="address2"
            placeholder="例：近江八幡市"
            autocomplete="address-level2"
            readonly
            tabindex="-1"
          >

        </div>


        <!-- 住所3 -->

        <div class="form-group">

          <label for="address3">
            住所3
            <span class="optional">町域</span>
          </label>

          <input
            type="text"
            id="address3"
            name="address3"
            placeholder="例：出町"
            autocomplete="address-line1"
            readonly
            tabindex="-1"
          >

        </div>


        <!-- 住所4 -->

        <div class="form-group">

          <label for="address4">
            住所4
            <span class="required">必須</span>
            <span class="optional">丁目・番地・マンション・アパート</span>
          </label>
          
          <input
            type="text"
            id="address4"
            name="address4"
            placeholder="例：1丁目2-3 尾賀亀ハイツ105号室"
            autocomplete="address-line2"
            required
          >

        </div>

      </div>

        <!-- ====================================== -->
        <!-- 車両情報カード -->
        <!-- ====================================== -->
        
        <div class="container">
        
          <div class="form-title">
            車両情報
          </div>
        
        
          <!-- 登録番号 -->
        
          <div class="form-group">
        
            <label for="registrationNumber">
              登録番号
              <span class="required">必須</span>
            </label>
        
            <input
              type="text"
              id="registrationNumber"
              name="registrationNumber"
              placeholder="例：滋賀580あ1234"
              required
            >
        
          </div>
        
        
          <!-- 車名 -->
        
          <div class="form-group">
        
            <label for="carName">
              車名
              <span class="required">必須</span>
            </label>
        
            <input
              type="text"
              id="carName"
              name="carName"
              placeholder="例：タント"
              required
            >
        
          </div>
        
        </div>
      
      <!-- 入力完了 -->

      <button type="submit">
        入力完了
      </button>
      
      </form>

    <!-- ====================================== -->
    <!-- お客さま確認画面 -->
    <!-- ====================================== -->
    
    <div
      id="customerConfirmScreen"
      class="container"
      style="display: none;"
    >
    
      <div class="form-title">
        入力内容をご確認下さい
      </div>
    
      <p>
        <strong>担当SS：</strong>
        <span id="customerConfirmStaffSS"></span>
      </p>
    
      <p>
        <strong>フリガナ：</strong>
        <span id="customerConfirmFurigana"></span>
      </p>
    
      <p>
        <strong>氏名：</strong>
        <span id="customerConfirmName"></span>
      </p>
    
      <p>
        <strong>自宅番号：</strong>
        <span id="customerConfirmHomeTel"></span>
      </p>
    
      <p>
        <strong>携帯番号：</strong>
        <span id="customerConfirmMobileTel"></span>
      </p>
    
      <p>
        <strong>郵便番号：</strong>
        <span id="customerConfirmZipcode"></span>
      </p>
    
      <p>
        <strong>住所：</strong>
        <span id="customerConfirmAddress"></span>
      </p>
    
      <p>
        <strong>登録番号：</strong>
        <span id="customerConfirmRegistrationNumber"></span>
      </p>
    
      <p>
        <strong>車名：</strong>
        <span id="customerConfirmCarName"></span>
      </p>
    
    
      <button
        type="button"
        id="customerConfirmButton"
      >
        この内容で確定する
      </button>
    
      <button
        type="button"
        id="customerBackButton"
        class="staff-mode-button"
      >
        入力内容を修正する
      </button>
    
    </div>
      
      <!-- ====================================== -->
      <!-- 入力完了画面 -->
      <!-- ====================================== -->
      
      <div
        id="completeScreen"
        class="container complete-screen"
        style="display: none;"
      >
      
        <div class="complete-title">
          入力ありがとうございます。
        </div>
      
        <div class="complete-message">
          タブレットをスタッフまでお渡し下さい。
        </div>
      
      
        <!-- スタッフモード -->
      
        <div class="staff-login">
      
          <label for="staffCode">
            スタッフコード
          </label>
      
          <input
            type="password"
            id="staffCode"
            name="staffCode"
            inputmode="numeric"
            maxlength="4"
            placeholder="スタッフコードを入力"
            autocomplete="off"
          >
      
          <div
            id="staffCodeMessage"
            class="staff-code-message"
          ></div>
      
          <button
            type="button"
            id="staffModeButton"
            class="staff-mode-button"
          >
            スタッフモードへ
          </button>
      
        </div>
      
      </div>


      <!-- ====================================== -->
      <!-- スタッフモード画面 -->
      <!-- ====================================== -->
      
      <div
        id="staffScreen"
        class="staff-screen"
        style="display: none;"
      >
      
        <div class="container">
      
          <div class="form-title">
            スタッフモード
          </div>

          <!-- お客さま入力内容確認 -->

          <div class="form-title">
            お客さま入力内容確認
          </div>
          
          <div id="customerConfirm">
          
            <p><strong>担当SS：</strong><span id="confirmStaffSS"></span></p>
          
            <p><strong>フリガナ：</strong><span id="confirmFurigana"></span></p>
          
            <p><strong>氏名：</strong><span id="confirmName"></span></p>
          
            <p><strong>自宅番号：</strong><span id="confirmHomeTel"></span></p>
          
            <p><strong>携帯番号：</strong><span id="confirmMobileTel"></span></p>
          
            <p><strong>郵便番号：</strong><span id="confirmZipcode"></span></p>
          
            <p><strong>住所：</strong><span id="confirmAddress"></span></p>
          
            <p><strong>登録番号：</strong><span id="confirmRegistrationNumber"></span></p>
          
            <p><strong>車名：</strong><span id="confirmCarName"></span></p>

            <button
            type="button"
            id="backToFormButton"
            class="staff-mode-button"
          >
            入力内容を修正する
          </button>


            
          </div>
          
          <div class="form-group">
      
            <label for="telAppointmentMemo">
              TELアポメモ
              <span class="optional">お客さまからヒアリングすること</span>
            </label>
      
            <textarea
              id="telAppointmentMemo"
              name="telAppointmentMemo"
              rows="10"
              placeholder="TELアポタイミング（曜日や時間帯）を入力して下さい。"
            ></textarea>
      
          </div>
      
        </div>
      
        <button
          type="button"
          id="staffCompleteButton"
        >
          スタッフ入力完了
        </button>
      
      </div>
      
      
      </div>
      
      <script>
        "use strict";
      
        const form =
        document.getElementById("surveyForm");

    const customerConfirmScreen =
        document.getElementById("customerConfirmScreen");
    
    const customerConfirmButton =
        document.getElementById("customerConfirmButton");
    
    const customerBackButton =
        document.getElementById("customerBackButton");
        
    const completeScreen =
        document.getElementById("completeScreen");
  
    const staffScreen =
        document.getElementById("staffScreen");
  
    const telAppointmentMemoInput =
        document.getElementById("telAppointmentMemo");
  
    const staffCompleteButton =
        document.getElementById("staffCompleteButton");
    
    const backToFormButton =
        document.getElementById("backToFormButton");
        
    const staffCodeInput =
        document.getElementById("staffCode");
      
    const staffModeButton =
        document.getElementById("staffModeButton");
      
    const staffCodeMessage =
        document.getElementById("staffCodeMessage");
      
    const staffSSInput =
        document.getElementById("staffSS");

    const furiganaInput =
        document.getElementById("furigana");
      
      const nameInput =
        document.getElementById("name");
      
      const homeTelInput =
        document.getElementById("homeTel");
      
      const mobileTelInput =
        document.getElementById("mobileTel");
      
      const zipcodeInput =
        document.getElementById("zipcode");
      
      const address1Input =
        document.getElementById("address1");
      
      const address2Input =
        document.getElementById("address2");
      
      const address3Input =
        document.getElementById("address3");
      
      const address4Input =
        document.getElementById("address4");
            
      const registrationNumberInput =
        document.getElementById("registrationNumber");
      
      const carNameInput =
        document.getElementById("carName");
      
      const zipMessage =
        document.getElementById("zipMessage");

      // ========================================
      // スタッフコード
      // ========================================
      
      staffCodeInput.addEventListener("input", function () {
      
        // 数字以外は入力させない
        this.value =
          this.value.replace(/[^0-9]/g, "");
      
        staffCodeMessage.textContent = "";
      
      });
      
      
      staffModeButton.addEventListener("click", function () {
      
        const staffCode =
          staffCodeInput.value.trim();
      
      
        // 未入力
        if (staffCode === "") {
      
          staffCodeMessage.textContent =
            "スタッフコードを入力して下さい。";
      
          staffCodeInput.focus();
      
          return;
      
        }
      
      
        // スタッフコード不一致
        if (staffCode !== "0000") {
      
          staffCodeMessage.textContent =
            "スタッフコードが違います。";
      
          staffCodeInput.value = "";
      
          staffCodeInput.focus();
      
          return;
      
        }
      
      
        // スタッフコード一致
        staffCodeMessage.textContent = "";
        
        // ========================================
        // お客さま入力内容を確認画面へ表示
        // ========================================
        
        document.getElementById("confirmStaffSS").textContent =
          staffSSInput.value.trim();
        
        document.getElementById("confirmFurigana").textContent =
          furiganaInput.value.trim();
        
        document.getElementById("confirmName").textContent =
          nameInput.value.trim();
        
        document.getElementById("confirmHomeTel").textContent =
          homeTelInput.value.trim() || "未入力";
        
        document.getElementById("confirmMobileTel").textContent =
          mobileTelInput.value.trim() || "未入力";
        
        document.getElementById("confirmZipcode").textContent =
          zipcodeInput.value.trim();
        
        document.getElementById("confirmAddress").textContent =
          [
            address1Input.value.trim(),
            address2Input.value.trim(),
            address3Input.value.trim(),
            address4Input.value.trim()
          ]
            .filter(Boolean)
            .join("");
        
        document.getElementById("confirmRegistrationNumber").textContent =
          registrationNumberInput.value.trim();
        
        document.getElementById("confirmCarName").textContent =
          carNameInput.value.trim();
        
        
        // 完了画面を非表示
        completeScreen.style.display = "none";
        
        // スタッフモード画面を表示
        staffScreen.style.display = "block";
        
        // スタッフコードを消去
        staffCodeInput.value = "";
        
        // TELアポメモへカーソルを移動
        telAppointmentMemoInput.focus();
        
        // ページ上部へ移動
        window.scrollTo({
          top: 0,
          behavior: "smooth"
      });
      
      });  //

      // ========================================
      // 入力内容を修正
      // ========================================
      
      backToFormButton.addEventListener("click", function () {
      
        // スタッフモードを非表示
        staffScreen.style.display = "none";
      
        // お客さま入力フォームを再表示
        form.style.display = "block";
      
        // ページ上部へ戻る
        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      
      });

      // ========================================
      // 必須項目のメッセージ
      // ========================================
      
      // 担当SS
      staffSSInput.addEventListener("invalid", function () {
        this.setCustomValidity("担当SSを選択して下さい。");
      });
      
      staffSSInput.addEventListener("change", function () {
        this.setCustomValidity("");
      });
      
      // フリガナ
      furiganaInput.addEventListener("invalid", function () {
      
        if (this.value.trim() === "") {
      
          this.setCustomValidity(
            "フリガナを入力して下さい。"
          );
      
        }
      
      });
      
      furiganaInput.addEventListener("input", function () {
      
        const value = this.value.trim();
      
        this.setCustomValidity("");
      
        if (
          value !== "" &&
          !/^[ァ-ヶーＡ-Ｚａ-ｚ０-９　]+$/.test(value)
        ) {
      
          this.setCustomValidity(
            "全角カタカナまたは全角英数字で入力して下さい。"
          );
      
        }
      
      });
    
      // 氏名
      nameInput.addEventListener("invalid", function () {
        this.setCustomValidity("氏名を入力して下さい。");
      });
      
      nameInput.addEventListener("input", function () {
        this.setCustomValidity("");
      });
      
      
      // 郵便番号
      zipcodeInput.addEventListener("invalid", function () {
        this.setCustomValidity("郵便番号をハイフン付きで入力して下さい。\n例：523-0892");
      });
      
      zipcodeInput.addEventListener("input", function () {
        this.setCustomValidity("");
      });
      
      
      // 登録番号
      registrationNumberInput.addEventListener("invalid", function () {
        this.setCustomValidity("登録番号を入力して下さい。");
      });

      // 住所4
      address4Input.addEventListener("invalid", function () {
        this.setCustomValidity("丁目や番地を入力して下さい。");
      });
      
      address4Input.addEventListener("input", function () {
        this.setCustomValidity("");
      });
      
      registrationNumberInput.addEventListener("input", function () {
        this.setCustomValidity("");
      });
      
      
      // 車名
      carNameInput.addEventListener("invalid", function () {
        this.setCustomValidity("車名を入力して下さい。");
      });
      
      carNameInput.addEventListener("input", function () {
        this.setCustomValidity("");
      });

    // ========================================
    // 電話番号入力制限
    // 半角数字と半角ハイフンのみ
    // ========================================

    function restrictPhoneInput(input) {

      input.addEventListener("input", function () {

        this.value =
          this.value.replace(/[^0-9-]/g, "");

      });

    }


    restrictPhoneInput(homeTelInput);
    restrictPhoneInput(mobileTelInput);


    // ========================================
    // 電話番号チェック
    // ========================================

    function checkPhoneNumber(value) {

      if (value === "") {
        return true;
      }

      if (!/^[0-9-]+$/.test(value)) {
        return false;
      }

      const hyphenCount =
        (value.match(/-/g) || []).length;

      return hyphenCount === 2;

    }


    // ========================================
    // 郵便番号メッセージ表示
    // ========================================

    function showZipMessage(message, type) {

      zipMessage.textContent = message;

      zipMessage.className = "zip-message";

      if (type) {
        zipMessage.classList.add(type);
      }

    }


    // ========================================
    // 郵便番号入力
    // ========================================

    zipcodeInput.addEventListener("input", function () {

      this.value =
        this.value.replace(/[^0-9-]/g, "");

      const zipcode = this.value;


      if (zipcode === "") {

        showZipMessage("", "");

        return;

      }


      if (zipcode.length === 8) {

        if (!/^\d{3}-\d{4}$/.test(zipcode)) {

          showZipMessage(
            "郵便番号は「123-4567」の形式で入力して下さい。",
            "error"
          );

          return;

        }

        searchAddress(zipcode);

        return;

      }


      showZipMessage(
        "ハイフン付きで入力して下さい。例：523-0892",
        ""
      );

    });


    // ========================================
    // 郵便番号から住所検索
    // ========================================

    async function searchAddress(zipcode) {

      showZipMessage(
        "住所を検索しています。",
        ""
      );


      try {

        const url =
          "https://zipcloud.ibsnet.co.jp/api/search?zipcode=" +
          encodeURIComponent(zipcode);


        const response =
          await fetch(url);


        if (!response.ok) {

          throw new Error(
            "通信エラー：" + response.status
          );

        }


        const result =
          await response.json();


        if (
          result.status !== 200 ||
          !result.results ||
          result.results.length === 0
        ) {

          address1Input.value = "";
          address2Input.value = "";
          address3Input.value = "";

          showZipMessage(
            "該当する住所が見つかりませんでした。",
            "error"
          );

          return;

        }


        const address =
          result.results[0];


        address1Input.value =
          address.address1 || "";

        address2Input.value =
          address.address2 || "";

        address3Input.value =
          address.address3 || "";


        showZipMessage(
          "住所を自動入力しました。",
          "success"
        );

      } catch (error) {

        console.error(error);

        showZipMessage(
          "住所を取得できませんでした。通信状況を確認して下さい。",
          "error"
        );

      }

    }


    // ========================================
    // 郵便番号チェック
    // ========================================

    function checkZipcode(value) {

      return /^\d{3}-\d{4}$/.test(value);

    }


    // ========================================
    // 入力完了
    // ========================================

    form.addEventListener(
      "submit",
      function (event) {

        event.preventDefault();


        const name =
          document
            .getElementById("name")
            .value
            .trim();

        const staffSS =
          staffSSInput
            .value
            .trim();
        
        const furigana =
          furiganaInput
            .value
            .trim();

        const homeTel =
          homeTelInput
            .value
            .trim();


        const mobileTel =
          mobileTelInput
            .value
            .trim();


        const zipcode =
          zipcodeInput
            .value
            .trim();


        const address1 =
          address1Input
            .value
            .trim();


        const address2 =
          address2Input
            .value
            .trim();


        const address3 =
          address3Input
            .value
            .trim();


        const address4 =
          address4Input
            .value
            .trim();

        const registrationNumber =
          registrationNumberInput
            .value
            .trim();
        
        const carName =
          carNameInput
            .value
            .trim();


        // ========================================
        // 自宅番号チェック
        // ========================================

        if (!checkPhoneNumber(homeTel)) {

          alert(
            "自宅番号を以下の通り入力して下さい。\n\n" +
            "例：0748-12-3456"
          );

          homeTelInput.focus();

          return;

        }


        // ========================================
        // 携帯番号チェック
        // ========================================

        if (!checkPhoneNumber(mobileTel)) {

          alert(
            "携帯番号を以下の通り入力して下さい。\n\n" +
            "例：090-1234-5678"
          );

          mobileTelInput.focus();

          return;

        }


        // ========================================
        // 郵便番号チェック
        // ========================================

        if (!checkZipcode(zipcode)) {

          alert(
            "郵便番号を以下の通り入力して下さい。\n\n" +
            "例：523-0892"
          );

          zipcodeInput.focus();

          return;

        }


        // ========================================
        // 入力完了用データ
        // ========================================

        const data = {

            staffSS: staffSS,
          
            furigana: furigana,
          
            name: name,
          
            homeTel: homeTel,
          
            mobileTel: mobileTel,
          
            zipcode: zipcode,
          
            address1: address1,
          
            address2: address2,
          
            address3: address3,
          
            address4: address4,
                    
            registrationNumber: registrationNumber,
          
            carName: carName
          
          };

        console.log(data);

        // ========================================
        // お客さま確認画面に入力内容を表示
        // ========================================
        
        document.getElementById("customerConfirmStaffSS").textContent =
          staffSS;
        
        document.getElementById("customerConfirmFurigana").textContent =
          furigana;
        
        document.getElementById("customerConfirmName").textContent =
          name;
        
        document.getElementById("customerConfirmHomeTel").textContent =
          homeTel || "未入力";
        
        document.getElementById("customerConfirmMobileTel").textContent =
          mobileTel || "未入力";
        
        document.getElementById("customerConfirmZipcode").textContent =
          zipcode;
        
        document.getElementById("customerConfirmAddress").textContent =
          [
            address1,
            address2,
            address3,
            address4
          ]
            .filter(Boolean)
            .join("");
        
        document.getElementById(
          "customerConfirmRegistrationNumber"
        ).textContent =
          registrationNumber;
        
        document.getElementById("customerConfirmCarName").textContent =
          carName;
        
        
        // 入力フォームを非表示
        form.style.display = "none";
        
        // お客さま確認画面を表示
        customerConfirmScreen.style.display = "block";
        
        // ページ上部へ
        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      }
    );

        // ========================================
        // お客さま確認画面 → 入力画面へ戻る
        // ========================================
        
        customerBackButton.addEventListener("click", function () {
        
          customerConfirmScreen.style.display = "none";
        
          form.style.display = "block";
        
          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });
        
        });

        // ========================================
        // お客さま入力内容確定
        // ========================================
        
        customerConfirmButton.addEventListener("click", function () {
        
          customerConfirmScreen.style.display = "none";
        
          completeScreen.style.display = "block";
        
          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });
        
        });
        
        // ========================================
        // スタッフ入力完了
        // ========================================
        
        staffCompleteButton.addEventListener("click", function () {
        
          const telAppointmentMemo =
            telAppointmentMemoInput.value.trim();
        
          const finalData = {
        
            staffSS: staffSSInput.value.trim(),
        
            furigana: furiganaInput.value.trim(),
        
            name: nameInput.value.trim(),
        
            homeTel: homeTelInput.value.trim(),
        
            mobileTel: mobileTelInput.value.trim(),
        
            zipcode: zipcodeInput.value.trim(),
        
            address1: address1Input.value.trim(),
        
            address2: address2Input.value.trim(),
        
            address3: address3Input.value.trim(),
        
            address4: address4Input.value.trim(),
        
            registrationNumber:
              registrationNumberInput.value.trim(),
        
            carName:
              carNameInput.value.trim(),
        
            telAppointmentMemo:
              telAppointmentMemo
        
          };
        
          console.log(finalData);

const powerAutomateUrl =
  "https://default1a2cf14ad33440fe9e6c8e9728b84d.0d.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/30/workflows/0eb5cfb8d1cd41079adb8bccd4bc2614/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=kZN_VAyhxNx0yQDKSvJCgahXmIH9LTlNiE-DO0WzVgY";

staffCompleteButton.disabled = true;
staffCompleteButton.textContent = "登録中です...";

fetch(powerAutomateUrl, {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify(finalData)
})
  .then(function (response) {

    if (!response.ok) {
      throw new Error(
        "送信エラー：" + response.status
      );
    }

    return response.text();

  })
  .then(function () {

    alert(
      "kintoneへの登録が完了しました。"
    );

    staffCompleteButton.textContent =
      "登録完了";

  })
  .catch(function (error) {

    console.error(error);

    alert(
      "登録に失敗しました。\n" +
      "入力内容は消えていません。\n" +
      "もう一度お試し下さい。"
    );

    staffCompleteButton.disabled = false;
    staffCompleteButton.textContent =
      "スタッフ入力完了";

  });
        
        });
        
  </script>
