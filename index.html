<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>アンケート入力</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: #f5f5f5;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
      color: #444;
    }

    /* ページ全体 */
    .page {
      width: 100%;
      max-width: 650px;
      margin: 40px auto;
    }

    /* タイトル */
    h1 {
      margin: 0;
      color: #00b84f;
      font-size: 30px;
      font-weight: 700;
      text-align: center;
    }

    .subtitle {
      margin: 8px 0 30px;
      color: #555;
      font-size: 14px;
      text-align: center;
    }

    /* 緑枠カード */
    .container {
      width: 100%;
      background-color: #ffffff;

      /* 写真のような上側の緑ライン */
      border-top: 5px solid #00c853;

      border-radius: 12px;
      padding: 30px;

      box-shadow:
        0 3px 8px rgba(0, 0, 0, 0.12);
    }

    /* カード内タイトル */
    .form-title {
      margin: 0 0 25px;
      color: #00b84f;
      font-size: 20px;
      font-weight: 700;
    }

    /* 入力項目 */
    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #444;
      font-size: 15px;
      font-weight: 600;
    }

    .required {
      display: inline-block;
      margin-left: 6px;
      color: #e74c3c;
      font-size: 12px;
      font-weight: 600;
    }

    .optional {
      display: inline-block;
      margin-left: 6px;
      color: #888;
      font-size: 12px;
      font-weight: normal;
    }

    /* 入力欄 */
    input {
      width: 100%;
      height: 48px;
      padding: 10px 12px;

      border: 1px solid #cccccc;
      border-radius: 6px;

      background-color: #ffffff;

      color: #333;
      font-size: 16px;

      outline: none;

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    input:focus {
      border-color: #00c853;

      box-shadow:
        0 0 0 2px rgba(0, 200, 83, 0.12);
    }

    /* 送信ボタン */
    button {
      width: 100%;
      height: 50px;

      margin-top: 10px;

      border: none;
      border-radius: 6px;

      background-color: #00b84f;

      color: #ffffff;
      font-size: 17px;
      font-weight: 700;

      cursor: pointer;

      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #009f45;
    }

    button:active {
      background-color: #00883b;
    }

    /* スマートフォン */
    @media (max-width: 600px) {

      body {
        padding: 12px;
      }

      .page {
        margin: 20px auto;
      }

      h1 {
        font-size: 25px;
      }

      .container {
        padding: 24px 18px;
      }
    }
  </style>
</head>


<body>

  <div class="page">

    <h1>アンケート入力</h1>

    <div class="subtitle">
      必要事項をご入力ください
    </div>


    <div class="container">

      <div class="form-title">
        お客さま情報
      </div>


      <form id="surveyForm">


        <!-- 氏名 -->

        <div class="form-group">

          <label for="name">
            氏名
            <span class="required">必須</span>
          </label>

          <input
            type="text"
            id="name"
            name="name"
            placeholder="例：山田 太郎"
            required
          >

        </div>


        <!-- 自宅番号 -->

        <div class="form-group">

          <label for="homeTel">
            自宅番号
            <span class="optional">任意</span>
          </label>

          <input
            type="tel"
            id="homeTel"
            name="homeTel"
            inputmode="tel"
            placeholder="例：0748-12-3456"
          >

        </div>


        <!-- 携帯番号 -->

        <div class="form-group">

          <label for="mobileTel">
            携帯番号
            <span class="optional">任意</span>
          </label>

          <input
            type="tel"
            id="mobileTel"
            name="mobileTel"
            inputmode="tel"
            placeholder="例：090-1234-5678"
          >

        </div>


        <!-- 送信 -->

        <button type="submit">
          送信
        </button>


      </form>

    </div>

  </div>


  <script>

    const form = document.getElementById("surveyForm");

    const homeTelInput =
      document.getElementById("homeTel");

    const mobileTelInput =
      document.getElementById("mobileTel");


    // ========================================
    // 電話番号入力制限
    // 半角数字と半角ハイフンのみ
    // ========================================

    function restrictPhoneInput(input) {

      input.addEventListener("input", function () {

        this.value =
          this.value.replace(/[^0-9-]/g, "");

      });

    }


    restrictPhoneInput(homeTelInput);

    restrictPhoneInput(mobileTelInput);



    // ========================================
    // 電話番号チェック
    // ========================================

    function checkPhoneNumber(value) {

      // 空欄ならOK

      if (value === "") {
        return true;
      }


      // 半角数字とハイフン以外はNG

      if (!/^[0-9-]+$/.test(value)) {
        return false;
      }


      // ハイフンの個数

      const hyphenCount =
        (value.match(/-/g) || []).length;


      // ハイフンが2個ならOK

      return hyphenCount === 2;

    }



    // ========================================
    // 送信処理
    // ========================================

    form.addEventListener(
      "submit",
      function (event) {

        event.preventDefault();


        const name =
          document
            .getElementById("name")
            .value
            .trim();


        const homeTel =
          homeTelInput
            .value
            .trim();


        const mobileTel =
          mobileTelInput
            .value
            .trim();


        // 自宅番号チェック

        if (!checkPhoneNumber(homeTel)) {

          alert(
            "自宅番号を正しく入力してください。\n\n" +
            "入力する場合はハイフンを2つ入れてください。\n" +
            "例：0748-12-3456"
          );

          homeTelInput.focus();

          return;

        }


        // 携帯番号チェック

        if (!checkPhoneNumber(mobileTel)) {

          alert(
            "携帯番号を正しく入力してください。\n\n" +
            "入力する場合はハイフンを2つ入れてください。\n" +
            "例：090-1234-5678"
          );

          mobileTelInput.focus();

          return;

        }


        // ========================================
        // 送信用データ
        // ========================================

        const data = {

          name: name,

          homeTel: homeTel,

          mobileTel: mobileTel

        };


        console.log(data);


        alert(
          "入力内容に問題ありません。"
        );

      }
    );

  </script>

</body>

</html>
